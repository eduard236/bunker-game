<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Металлический фон (тёмный, с заклёпками) -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242b27"/>
      <stop offset="100%" stop-color="#0a0c0b"/>
    </linearGradient>
    
    <!-- Жёлтая краска (сверху светлее, снизу темнее) -->
    <linearGradient id="yellowPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd35c"/>
      <stop offset="60%" stop-color="#e6a61a"/>
      <stop offset="100%" stop-color="#b37414"/>
    </linearGradient>
  </defs>

  <!-- Металлический корпус -->
  <rect width="64" height="64" rx="12" fill="url(#metal)" stroke="#39423c" stroke-width="2"/>
  
  <!-- Заклёпки по углам -->
  <circle cx="6" cy="6" r="2" fill="#4a544c"/>
  <circle cx="58" cy="6" r="2" fill="#4a544c"/>
  <circle cx="6" cy="58" r="2" fill="#4a544c"/>
  <circle cx="58" cy="58" r="2" fill="#4a544c"/>

  <!-- Лёгкое углубление под знак -->
  <circle cx="32" cy="32" r="21" fill="#0a0c0b" stroke="#1b211e" stroke-width="2"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffb648" stroke-width="1.5" opacity="0.3"/>

  <!-- Жёлтый круг с «краской» -->
  <circle cx="32" cy="32" r="19" fill="url(#yellowPaint)"/>

  <!-- Тень под чёрными лопастями (для объёма) -->
  <g transform="translate(0, 1.5)" fill="#0a0c0b" opacity="0.6">
    <!-- Верхняя лопасть (идеально скруглённая внутренняя дуга) -->
    <path d="M23.5,17.28 A17,17 0 0 1 40.5,17.28 L36.5,24.21 A9,9 0 0 0 27.5,24.21 Z"/>
    <!-- Правая нижняя -->
    <path d="M23.5,17.28 A17,17 0 0 1 40.5,17.28 L36.5,24.21 A9,9 0 0 0 27.5,24.21 Z" transform="rotate(120 32 32)"/>
    <!-- Левая нижняя -->
    <path d="M23.5,17.28 A17,17 0 0 1 40.5,17.28 L36.5,24.21 A9,9 0 0 0 27.5,24.21 Z" transform="rotate(240 32 32)"/>
    <!-- Центральный круг (тень) -->
    <circle cx="32" cy="33.5" r="6"/>
  </g>

  <!-- Основные чёрные лопасти -->
  <g fill="#111111" stroke="#0a0c0b" stroke-width="1">
    <!-- Верхняя -->
    <path d="M23.5,17.28 A17,17 0 0 1 40.5,17.28 L36.5,24.21 A9,9 0 0 0 27.5,24.21 Z"/>
    <!-- Правая нижняя -->
    <path d="M23.5,17.28 A17,17 0 0 1 40.5,17.28 L36.5,24.21 A9,9 0 0 0 27.5,24.21 Z" transform="rotate(120 32 32)"/>
    <!-- Левая нижняя -->
    <path d="M23.5,17.28 A17,17 0 0 1 40.5,17.28 L36.5,24.21 A9,9 0 0 0 27.5,24.21 Z" transform="rotate(240 32 32)"/>
  </g>

  <!-- Центральный чёрный круг -->
  <circle cx="32" cy="32" r="6" fill="#111111" stroke="#0a0c0b" stroke-width="1.5"/>

  <!-- Блик на жёлтом (эффект краски/стекла) -->
  <ellipse cx="26" cy="20" rx="7" ry="3" fill="#fff" opacity="0.25" transform="rotate(-30 26 20)"/>
</svg>