<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бункер не доступен</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Mono','Courier New',monospace;color:#d6d0bd;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:radial-gradient(800px 400px at 50% -10%,rgba(255,182,72,.08),transparent 60%),linear-gradient(160deg,#0a0c0b,#111514)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.box{max-width:640px;width:92%;text-align:center;border:2px solid #c77c1a;border-radius:12px;padding:44px 30px;position:relative;
background:radial-gradient(circle at 50% 0%,#1c1206,#0d0802 75%);box-shadow:inset 0 0 46px rgba(255,182,72,.08)}
.tape{height:12px;margin:0 auto 26px;max-width:340px;background:repeating-linear-gradient(45deg,#d9a520 0 14px,#151515 14px 28px);opacity:.75}
.sym{font-size:3rem;color:#ffb648;text-shadow:0 0 18px rgba(255,182,72,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
h1{font-family:'Russo One',sans-serif;color:#e8e1cc;letter-spacing:.12em;font-size:2.2rem;margin:12px 0 6px;text-shadow:2px 2px 0 rgba(140,47,34,.8)}
.sub{color:#ff4b3e;letter-spacing:.3em;text-transform:uppercase;font-size:.8rem;margin-bottom:18px;animation:led 1.2s infinite}
@keyframes led{0%,100%{opacity:1}50%{opacity:.3}}
p{line-height:1.7;color:#8b9186;margin-bottom:8px}
.btn{display:inline-block;margin-top:22px;padding:14px 30px;border:2px solid #ffb648;border-radius:8px;color:#ffb648;font-weight:700;letter-spacing:.08em;cursor:pointer;background:transparent;font-family:inherit;transition:all .25s}
.btn:hover{background:#ffb648;color:#141414;box-shadow:0 0 22px rgba(255,182,72,.5)}
.timer{margin-top:16px;font-size:.8rem;color:#8b9186}
.timer b{color:#69ff8e;text-shadow:0 0 8px rgba(105,255,142,.5)}
</style>
</head>
<body>
<div class="box">
  <div class="tape"></div>
  <div class="sym">☢</div>
  <h1>БУНКЕР ВЗОРВАН</h1>
  <div class="sub">Сервер не отвечает</div>
  <p>Оперативный центр временно не функционирует.</p>
  <p>Возможно, проводятся работы по устранению угрозы<br>или сервер находится на техническом обслуживании.</p>
  <button class="btn" onclick="location.reload()">🔄 ПЫТАТЬСЯ УСТАНОВИТЬ СВЯЗЬ</button>
  <div class="timer">Автоматическая попытка через: <b id="t">30</b> с</div>
</div>
<script>
let s = 30;
const el = document.getElementById('t');
const iv = setInterval(() => { s--; el.textContent = s; if (s <= 0) { clearInterval(iv); location.reload(); } }, 1000);
</script>
</body>
</html>
